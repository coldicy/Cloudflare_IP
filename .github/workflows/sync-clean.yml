name: Sync and Clean Data

on:
  schedule:
    # 每 5 分钟运行一次（可根据需要调整）
    - cron: '*/5 * * * *'
  workflow_dispatch:  # 允许手动触发
  push:
    branches: [ main, master ]

# 关键：设置正确的权限，允许写入内容和 actions
permissions:
  contents: write
  actions: write

jobs:
  sync-and-clean:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Git
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
    
    - name: Add upstream remote
      run: |
        # ⚠️ 请替换为实际的上游仓库 URL
        UPSTREAM_URL="https://github.com/xgonce/Cloudflare_IP.git"
        git remote add upstream "$UPSTREAM_URL" || git remote set-url upstream "$UPSTREAM_URL"
    
    - name: Fetch and merge upstream changes
      run: |
        git fetch upstream
        # 尝试合并上游的 main/master 分支，优先使用 result.csv
        CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
        if git merge upstream/main -m "chore: sync from upstream" 2>/dev/null; then
          echo "Merged from upstream/main"
        elif git merge upstream/master -m "chore: sync from upstream" 2>/dev/null; then
          echo "Merged from upstream/master"
        else
          echo "No upstream changes or merge conflicts, accepting upstream data file"
          # 如果有冲突，强制接受上游的 result.csv
          if [ -f "result.csv" ]; then
            git checkout upstream/main -- result.csv 2>/dev/null || git checkout upstream/master -- result.csv 2>/dev/null || true
          fi
        fi
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    
    - name: Clean data
      run: |
        python3 clean_data.py
    
    - name: Commit and push changes
      run: |
        git add cleaned/ result.csv
        if git diff --staged --quiet; then
          echo "✅ No changes to commit"
          exit 0
        fi
        
        git commit -m "chore(data): auto-sync and clean $(date '+%Y-%m-%d %H:%M')"
        
        # 获取当前分支名并推送
        CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
        git push origin "${CURRENT_BRANCH}"
        echo "🎉 Successfully pushed updates to ${CURRENT_BRANCH}!"
    
    - name: Upload artifacts (optional)
      uses: actions/upload-artifact@v4
      with:
        name: cleaned-data
        path: cleaned/
        retention-days: 7
